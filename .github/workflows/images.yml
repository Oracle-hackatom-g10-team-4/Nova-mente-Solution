name: Atlas container images
on:
  pull_request:
    paths:
      [
        "apps/**",
        "packages/**",
        "services/**",
        "infra/**",
        "scripts/**",
        "package*.json",
        ".github/workflows/images.yml",
      ]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish immutable images to GHCR (review package visibility and quotas)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target: [web, api, eve, cognition]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Resolve lowercase registry names
        id: names
        shell: bash
        run: |
          echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          file: ${{ matrix.target == 'cognition' && 'infra/Dockerfile.cognition' || 'infra/Dockerfile.node' }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: ${{ matrix.target == 'cognition' && !(github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main') }}
          push: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ steps.names.outputs.repository }}/atlas-${{ matrix.target }}:${{ github.sha }}
          cache-from: type=gha,scope=atlas-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=atlas-${{ matrix.target }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Docker's local exporter cannot load the attestation manifest index.
          # Keep provenance for published images; local cognition still runs the HTTP smoke below.
          provenance: ${{ matrix.target == 'cognition' && !(github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main') && 'false' || 'mode=min' }}
      - name: Verify cognition startup and HTTP authentication in the built image
        if: matrix.target == 'cognition'
        env:
          ATLAS_TEST_IMAGE: ghcr.io/${{ steps.names.outputs.repository }}/atlas-cognition:${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if ! docker image inspect "$ATLAS_TEST_IMAGE" > /dev/null 2>&1; then
            docker pull "$ATLAS_TEST_IMAGE"
          fi
          docker run --rm --network none --interactive --entrypoint python \
            -e ATLAS_INTERNAL_TOKEN=ci-image-only-token-not-for-production \
            -e ATLAS_APP_MODE=local -e ATLAS_SEED_DEMO=0 \
            "$ATLAS_TEST_IMAGE" - < scripts/check-cognition-image.py
      - name: Record immutable image identifier
        env:
          ATLAS_IMAGE: ghcr.io/${{ steps.names.outputs.repository }}/atlas-${{ matrix.target }}:${{ github.sha }}
          ATLAS_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          printf '%s@%s\n' "$ATLAS_IMAGE" "$ATLAS_DIGEST" > image-${{ matrix.target }}.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-${{ matrix.target }}
          path: image-${{ matrix.target }}.txt
          retention-days: 7
